version: '3.8'

services:
  mysql:
    image: mysql:8.0-debian
    container_name: accornium-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: accorniumdb
      MYSQL_ALLOW_EMPTY_PASSWORD: "false"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - accornium-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accornium-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/accorniumdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - accornium-network

volumes:
  mysql_data:

networks:
  accornium-network:
    driver: bridge

