# Server
server.port=8080

# MySQL datasource
# Create the database first (or let createDatabaseIfNotExist handle it):
#   CREATE DATABASE accorniumdb;
spring.datasource.url=jdbc:mysql://localhost:3306/accorniumdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# App info
spring.application.name=accornium-backend
