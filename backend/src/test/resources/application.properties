spring.application.name=finbank-backend
server.port=0

spring.datasource.url=jdbc:h2:mem:finbank;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=test-secret-key-1234567890-abcdef
app.jwt.expiration-ms=86400000
app.otp.expiration-minutes=5
app.mail.enabled=false
